<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>civx</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="favicon.ico">

  <!-- embeds -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://civx.lol/">
  <meta property="og:title" content="civx">
  <meta property="og:description" content="yoooo">
  <meta property="og:image" content="https://civx.lol/poster.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!--embed color bar -->
  <meta name="theme-color" content="#f59409">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      /*sup*/
      background: #0a1230;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /*  spectrum  */

    #viz {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 32vh;
      max-height: 260px;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.1s ease 0.25s;
    }

    body.entered #viz {
      opacity: 1;
    }

    /*  enter screen */

    .enter {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: rgba(4, 8, 22, 0.55);
      backdrop-filter: blur(3px);
      cursor: pointer;
      transition: opacity 0.55s ease, backdrop-filter 0.55s ease;
    }

    .enter p {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.55);
      user-select: none;
      animation: breathe 2.6s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    .enter.gone {
      opacity: 0;
      backdrop-filter: blur(0);
      pointer-events: none;
    }


    .center {
      display: grid;
      justify-items: center;
      transform: translateY(-5vh);
    }

    .wordmark {
      position: relative;
      margin: 0;
      font-size: clamp(3rem, 14vw, 12rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      /* word backdrop */
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.45);
      user-select: none;
      opacity: 0;
    }

    .tagline {
      margin: 0.4em 0 0;
      font-size: clamp(0.95rem, 2.2vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.45);
      user-select: none;
      opacity: 0;
    }


    body.entered .tagline {
      animation: emerge 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.55s forwards;
    }

    /* this the lil star in the i*/
    .wordmark .star {
      position: absolute;
      left: 38%;
      top: calc(30% - 0.035em);
      width: 0.09em;
      height: auto;
      /* 16px pic so its good qual*/
      image-rendering: pixelated;
      pointer-events: none;
      /* straight yams in my face */
      transform: translate(-50%, -50%);
      animation: spin 14s linear infinite;
    }

    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* this is so  the music and title play together */
    body.entered .wordmark {
      animation: emerge 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s forwards;
    }

    @keyframes emerge {
      from {
        opacity: 0;
        filter: blur(24px);
        letter-spacing: 0.12em;
      }

      to {
        opacity: 1;
        filter: blur(0);
        letter-spacing: -0.03em;
      }
    }

    /*  bottom left animation  */

    .ticker {
      position: fixed;
      left: 14px;
      bottom: 8px;
      width: 150px;
      /* overlaying i*/
      z-index: 11;
      overflow: hidden;
      transform: translate(calc(50vw - 89px), calc(-50vh + 58px));
      transition: transform 0.75s cubic-bezier(0.22, 0.61, 0.36, 1);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 82%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 82%, transparent);
    }

    body.entered .ticker {
      transform: translate(0, 0);
    }

    .ticker h1 {
      display: flex;
      width: max-content;
      margin: 0;
      white-space: nowrap;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
      user-select: none;
      animation: drift 3.2s linear infinite;
      will-change: transform;
    }

    .ticker span {
      padding-right: 1.5em;
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }


    /*  volume control  */
    .volume {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
      color: #fff;
    }

    .volume svg {
      width: 15px;
      height: 15px;
      display: block;
      opacity: 0.85;
      flex: none;
    }

    .volume input {
      -webkit-appearance: none;
      appearance: none;
      width: 92px;
      height: 3px;
      margin: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.32);
      cursor: pointer;
    }

    .volume input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 6px;
    }

    .volume input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    .volume input::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    @media (prefers-reduced-motion: reduce) {
      #bg {
        display: none;
      }

      #viz {
        display: none;
      }

      body {
        background: #0a1230 url("poster.jpg") center / cover no-repeat;
      }

      .enter p {
        animation: none;
        opacity: 0.9;
      }

      .ticker {
        transition: none;
      }

      .ticker h1 {
        animation: none;
      }

      .wordmark .star {
        animation: none;
      }

      /* animation is suppressed here, so reveal the wordmark outright. */
      body.entered .wordmark {
        animation: none;
        opacity: 1;
      }

      body.entered .tagline {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <video id="bg" autoplay muted loop playsinline poster="poster.jpg">
    <source src="bg.mp4" type="video/mp4">
  </video>

  <canvas id="viz" aria-hidden="true"></canvas>

  <div class="center">
    <h1 class="wordmark" id="wordmark">civx<img class="star" src="star.png" alt="" aria-hidden="true"></h1>
    <p class="tagline">what's up ☺︎</p>
  </div>

  <div class="ticker">
    <h1>
      <span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span>
      <span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span>
    </h1>
  </div>

  <div class="volume">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
    </svg>
    <input type="range" id="volume" min="0" max="100" value="20" aria-label="Volume">
  </div>



  <audio id="jaydes" src="jaydes.mp3" preload="auto"></audio>

  <div class="enter" id="enter" role="button" tabindex="0" aria-label="Enter">
    <p>click anywhere</p>
  </div>

  <script>
    const track = document.getElementById("jaydes");
    const volume = document.getElementById("volume");
    const enter = document.getElementById("enter");
    const canvas = document.getElementById("viz");

    track.volume = volume.value / 100;

    let entered = false;

    /* ---- spectrum ---- */

    const ctx = canvas.getContext("2d");
    let analyser, bins, gradient, W, H;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      gradient = ctx.createLinearGradient(0, H * 0.1, 0, H);
      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.45, "#ffdca8");
      gradient.addColorStop(1, "#ff8a1e");
    }

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(bins);

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = gradient;

      const count = Math.max(48, Math.floor(W / 15));
      const slot = W / count;
      const barW = slot * 0.55;
      const base = H + 2;
      const maxH = H - 8;

      for (let i = 0; i < count; i++) {
        const bin = Math.floor(Math.pow(i / count, 2) * bins.length * 0.7);
        const h = Math.max(barW, (bins[bin] / 255) * maxH);
        const x = i * slot + (slot - barW) / 2;

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x, base - h, barW, h, [barW / 2, barW / 2, 0, 0]);
        } else {
          ctx.rect(x, base - h, barW, h);
        }
        ctx.fill();
      }
    }

    function startSpectrum() {
      try {
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        const source = audio.createMediaElementSource(track);
        analyser = audio.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.82;
        source.connect(analyser);
        analyser.connect(audio.destination);
        audio.resume();

        bins = new Uint8Array(analyser.frequencyBinCount);
        resize();
        window.addEventListener("resize", resize);
        requestAnimationFrame(draw);
      } catch (e) {
        canvas.style.display = "none";
      }
    }

    function enterSite() {
      if (entered) return;
      entered = true;
      startSpectrum();
      track.play().catch(() => { });
      document.body.classList.add("entered");
      enter.classList.add("gone");
      enter.addEventListener("transitionend", () => enter.remove(), { once: true });
    }

    enter.addEventListener("click", enterSite);
    document.addEventListener("keydown", enterSite);

    volume.addEventListener("input", () => {
      track.volume = volume.value / 100;
    });



    /*  tab animation  */
    const TITLE = "civx";
    const HOLD = 4;
    const REST = 2;

    const frames = [];
    for (let i = 1; i <= TITLE.length; i++) frames.push(TITLE.slice(0, i));
    for (let i = 0; i < HOLD; i++) frames.push(TITLE);
    for (let i = TITLE.length - 1; i >= 1; i--) frames.push(TITLE.slice(0, i));
    for (let i = 0; i < REST; i++) frames.push("\u3164");

    let step = 0;

    setInterval(() => {
      document.title = frames[step % frames.length];
      step++;
    }, 260);
  </script>

</body>

</html>
